name: TJK Workout Connection Check

on:
  push:
    branches: [main]
    paths: [".github/workflows/tjk-workout-check.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tjk-workout-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the standard curl client request once
        run: |
          curl --version
          status=0
          curl --http2 --silent --show-error --connect-timeout 10 --max-time 25 --max-filesize 1048576 \
            --header 'Accept: text/html' --header 'Accept-Language: tr-TR,tr;q=0.9' \
            --output /tmp/tjk-page.html \
            --write-out '{"event":"tjk-transport","httpStatus":%{http_code},"httpVersion":"%{http_version}","dns":%{time_namelookup},"tcp":%{time_connect},"tls":%{time_appconnect},"firstByte":%{time_starttransfer},"total":%{time_total},"bytes":%{size_download},"tlsVerify":%{ssl_verify_result}}\n' \
            'https://www.tjk.org/TR/YarisSever/Query/Page/IdmanIstatistikleri' || status=$?
          python3 - <<'PY'
          import json,re,pathlib
          p=pathlib.Path('/tmp/tjk-page.html')
          text=p.read_text(errors='replace') if p.exists() else ''
          dates=re.findall(r'IdmanIstatistikleri-IDMANTARIH[^>]*>\s*(\d{2})[./](\d{2})[./](\d{4})',text,re.I)
          dates=sorted(y+'-'+m+'-'+d for d,m,y in dates)
          print(json.dumps({'event':'tjk-content','bytes':len(text),'rows':len(dates),'newest':dates[-1] if dates else None,'pageTitle':re.findall(r'<title[^>]*>(.*?)</title>',text,re.S|re.I)[:1]}))
          PY
          exit "$status"
