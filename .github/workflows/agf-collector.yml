name: AGF 7/24 Collector

on:
  schedule:
    - cron: "*/5 3-22 * * *"
  workflow_dispatch:

concurrency:
  group: agf-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      AGF_SITE_URL: https://agf-radar.kemalgokayyarar.chatgpt.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect three adaptive rounds
        run: |
          status=0
          node ops/agf-collector.mjs || status=1
          sleep 120
          node ops/agf-collector.mjs || status=1
          sleep 120
          node ops/agf-collector.mjs || status=1
          exit "$status"
