name: AGF 7/24 Collector

on:
  push:
    branches: [main]
    paths:
      - "ops/**"
      - ".github/workflows/agf-collector.yml"
  schedule:
    # Her 5 dakikada bir; yoğun tam saat dakikalarından iki dakika kaydırılmıştır.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: agf-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      AGF_SITE_URL: https://agf-radar.kemalgokayyarar.chatgpt.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect one adaptive round
        run: node ops/agf-collector.mjs
